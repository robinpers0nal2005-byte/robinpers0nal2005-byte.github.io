<!doctype html>
<html>
<head>
<title>Welcome to Webpage</title>
<style>
    /* Classic 2000s Web Styling */
    body {
        background-color: #C0C0C0; /* Classic Windows gray background */
        font-family: "Times New Roman", Times, serif;
        color: #000000;
        margin: 0;
        padding: 20px;
    }

    .main-container {
        width: 600px;
        margin: 50px auto;
        background-color: #FFFFFF; /* White container */
        border: 3px outset #FFFFFF;
        padding: 20px;
        box-shadow: 5px 5px 10px #666666;
    }

    h1 {
        text-align: center;
        color: #000080; /* Classic navy blue header */
        font-family: Arial, sans-serif;
        border-bottom: 2px dashed #808080;
        padding-bottom: 10px;
    }

    .marquee-text {
        background-color: #000000;
        color: #00FF00; /* Matrix green text */
        font-family: "Courier New", Courier, monospace;
        padding: 5px;
        font-weight: bold;
        margin-bottom: 20px;
    }

    .content-box {
        border: 2px inset #808080;
        background-color: #F8F8F8;
        padding: 15px;
        min-height: 120px;
        margin-bottom: 20px;
    }

    .button-bar {
        text-align: center;
    }

    /* Classic 3D Beveled Button Style */
    .retro-btn {
        background-color: #E0E0E0;
        color: #000000;
        border: 2px outset #FFFFFF;
        padding: 8px 12px;
        font-weight: bold;
        cursor: pointer;
        font-family: Arial, sans-serif;
        margin: 5px;
    }

    .retro-btn:active {
        border: 2px inset #FFFFFF;
        background-color: #D0D0D0;
    }

    .footer {
        text-align: center;
        font-size: 11px;
        color: #666666;
        border-top: 1px solid #C0C0C0;
        padding-top: 10px;
    }
</style>

<script>
    // Simple JavaScript to swap out text in the content box when buttons are clicked
    function showContent(section) {
        const box = document.getElementById("dynamic-text");
        
        if (section === 'grade') {
            box.innerHTML = `<h3>Why I Should Get a Nine:</h3><p>i should get a nine because im funny i helped lunar multiple times, last week i helped a grandma with her bags sooo please give me that nine,</p>`;
        } else if (section === 'about') {
            box.innerHTML = `<h3>About Me:</h3><p>
                What time do you usually go to sleep?: around ten<br>
                What do you drive?: my sister nuts<br><br>
                How many siblings do you have?: I have 2 siblings<br><br>
                What is your favorite food or snack to eat?: watermelone<br><br>
                What is your favorite song or artist right now?: i like malcome todd
            </p>`;
        } else if (section === 'links') {
            box.innerHTML = `<h3>My Other Website:</h3><p><ul><li><a href='ekasivu.html' target='_blank'>Project 1 Link</a></li></ul></p>`;
        }
    }
</script>
</head>

<body>

<div class="main-container">
    <!-- Retro Marquee Header -->
    <div class="marquee-text">
        <marquee scrollamount="4">*** hello world ***</marquee>
    </div>

    <h1>My Awesome Web Project</h1>

    <!-- Navigation Buttons -->
    <div class="button-bar">
        <button class="retro-btn" onclick="showContent('grade')">Why a 9?</button>
        <button class="retro-btn" onclick="showContent('about')">About Me</button>
        <button class="retro-btn" onclick="showContent('links')">Other Websites</button>
    </div>

    <!-- Content Display Area -->
    <div class="content-box" id="dynamic-text">
        <h3>Hello Visitor!</h3>
        <p>Click one of the buttons above to explore different sections of my website. Hope you enjoy my work </p>
    </div>

    <div class="footer">
        &copy; 2006 My Retro Webpage. Best viewed in Netscape Navigator or Internet Explorer 6.0 at 800x600 resolution.
    </div>
</div>

</body>
</html>
